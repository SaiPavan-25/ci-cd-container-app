version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing Maven..."
      - mvn --version

  pre_build:
    commands:
      - echo "Building Spring Boot JAR..."
      - mvn clean package -DskipTests

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 158388008894.dkr.ecr.us-east-2.amazonaws.com

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t ci-cd-container-app .

      - echo "Tagging Docker image..."
      - docker tag ci-cd-container-app:latest 158388008894.dkr.ecr.us-east-2.amazonaws.com/ci-cd-container-app:latest

  post_build:
    commands:
      - echo "Pushing Docker image..."
      - docker push 158388008894.dkr.ecr.us-east-2.amazonaws.com/ci-cd-container-app:latest

      - echo "Creating imagedefinitions.json..."
      - printf '[{"name":"ci-cd-task","imageUri":"158388008894.dkr.ecr.us-east-2.amazonaws.com/ci-cd-container-app:latest"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json